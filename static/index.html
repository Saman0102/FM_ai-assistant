<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Assistant</title>
  <style>
    :root { --ink:#17221d; --paper:#f3efe5; --green:#235b45; --gold:#d5a84b; --line:#c8c1b2; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font-family:Georgia, serif; }
    main { min-height:100vh; display:grid; grid-template-columns:minmax(280px, 34%) 1fr; }
    aside { padding:clamp(2rem,7vw,6rem) clamp(1.5rem,5vw,5rem); background:var(--green); color:#f8f4e9; }
    .eyebrow { color:var(--gold); letter-spacing:.18em; text-transform:uppercase; font:12px monospace; }
    h1 { font-size:clamp(2.5rem,5vw,5rem); line-height:.95; font-weight:400; margin:2rem 0; }
    aside p { font:16px/1.6 system-ui,sans-serif; max-width:28rem; color:#d9e5d9; }
    section { display:flex; flex-direction:column; min-height:100vh; max-width:900px; width:100%; margin:auto; padding:clamp(1rem,4vw,4rem); }
    header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding-bottom:1rem; font:13px system-ui,sans-serif; }
    #status { color:var(--green); } #messages { flex:1; padding:2rem 0; overflow:auto; }
    .message { max-width:75%; margin:1rem 0; padding:1rem 1.1rem; border-left:3px solid var(--gold); white-space:pre-wrap; font:16px/1.55 system-ui,sans-serif; }
    .user { margin-left:auto; border-left:0; border-right:3px solid var(--green); background:#e8e2d4; }
    form { display:flex; gap:.7rem; border-top:1px solid var(--line); padding-top:1rem; }
    textarea { flex:1; resize:vertical; min-height:55px; border:1px solid var(--line); background:#fbf8ef; padding:.9rem; font:16px system-ui,sans-serif; }
    button { border:0; background:var(--green); color:#fff; padding:0 1.4rem; font:600 14px system-ui,sans-serif; cursor:pointer; } button:hover { background:#173f30; }
    .controls { display:flex; gap:1rem; margin-top:.8rem; font:13px system-ui,sans-serif; } label { display:flex; gap:.4rem; align-items:center; }
    @media (max-width:700px) { main { display:block; } aside { padding:2rem 1.5rem; } aside h1 { margin:1rem 0; font-size:3rem; } section { min-height:70vh; } .message { max-width:92%; } }
  </style>
</head>
<body>
  <main>
    <aside><div class="eyebrow">Applied AI / 02</div><h1>Atlas<br>Assistant</h1><p>Ask questions, search your knowledge base, and let the assistant use tools when a calculation or live context is useful.</p></aside>
    <section>
      <header><strong>Conversation</strong><span id="status">checking service...</span></header>
      <div id="messages"><div class="message">Welcome. What would you like to explore?</div></div>
      <form id="form"><textarea id="query" placeholder="Ask a question..." required></textarea><button type="submit">Send</button></form>
      <div class="controls"><label><input id="rag" type="checkbox" checked> knowledge base</label><label><input id="tools" type="checkbox" checked> tools</label><button id="reset" type="button">Reset</button></div>
    </section>
  </main>
  <script>
    const messages = document.querySelector('#messages');
    const add = (text, kind) => { const el = document.createElement('div'); el.className = `message ${kind || ''}`; el.textContent = text; messages.append(el); messages.scrollTop = messages.scrollHeight; };
    fetch('/health').then(r => r.json()).then(d => document.querySelector('#status').textContent = d.status === 'ok' ? '● online' : '● needs configuration').catch(() => document.querySelector('#status').textContent = '● offline');
    document.querySelector('#form').addEventListener('submit', async (event) => { event.preventDefault(); const input = document.querySelector('#query'); const query = input.value.trim(); if (!query) return; add(query, 'user'); input.value = ''; add('Thinking...', 'pending'); try { const response = await fetch('/query', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query, use_rag:document.querySelector('#rag').checked, use_tools:document.querySelector('#tools').checked}) }); const data = await response.json(); messages.lastChild.remove(); if (!response.ok) throw new Error(data.detail || 'Request failed'); add(data.response || 'No response returned.'); } catch (error) { messages.lastChild.remove(); add(`Error: ${error.message}`); } });
    document.querySelector('#reset').addEventListener('click', async () => { await fetch('/reset', {method:'POST'}); messages.innerHTML = ''; add('Conversation reset.'); });
  </script>
</body>
</html>
